name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create and Build Cordova App
        env:
          CI: true
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npm install -g cordova
          cordova telemetry off
          cordova create app_build ma.education.absencereader "AbsenceReader"
          cp www/index.html app_build/www/index.html
          cd app_build
          cordova platform add android@13.0.0 --no-interactive
          cordova build android --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absence-Card-Reader-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
